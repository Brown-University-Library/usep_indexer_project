[project]
name = "usep_indexer_project"
version = "0.1.0"
description = "Django listener and Solr indexer for USEP data updates."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi>=2026.10.23",
    "Django~=5.2.0",
    "httpx~=0.28.0",
    "lxml~=6.0.0",
    "python-dotenv~=1.1.0",
]

[dependency-groups]
local = [
    "django-stubs>=5.2,<5.3",
    "types-lxml>=2026.2.16",
]
staging = []
prod = []
ci_tests = []
